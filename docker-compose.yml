version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: campus_daze_mysql
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME:-campus_daze}
      MYSQL_USER: ${DB_USER:-campus_daze}
      MYSQL_PASSWORD: ${DB_PASSWORD:-campus_daze_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3306:3306"
    networks:
      - campus_daze_network

  redis:
    image: redis:7.0
    container_name: campus_daze_redis
    restart: always
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - campus_daze_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campus_daze_backend
    restart: always
    environment:
      - DEBUG=${DEBUG:-False}
      - SECRET_KEY=${SECRET_KEY}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - ALGORITHM=${ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      - DB_NAME=${DB_NAME:-campus_daze}
      - DB_USER=${DB_USER:-campus_daze}
      - DB_PASSWORD=${DB_PASSWORD:-campus_daze_password}
      - DB_HOST=mysql
      - DB_PORT=3306
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
    depends_on:
      - mysql
      - redis
    ports:
      - "8000:8000"
    networks:
      - campus_daze_network
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: campus_daze_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - campus_daze_network

  nginx:
    image: nginx:latest
    container_name: campus_daze_nginx
    restart: always
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf
      - ./frontend/dist:/usr/share/nginx/html
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend
    networks:
      - campus_daze_network

volumes:
  mysql_data:
  redis_data:

networks:
  campus_daze_network:
    driver: bridge