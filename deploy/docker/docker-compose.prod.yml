# 同舟喵济 - 生产环境 Docker Compose（一体化部署，不引入 Nginx）
# 用法:
#   cd deploy/docker
#   copy .env.docker.example .env  (修改密码/密钥)
#   docker compose -f docker-compose.prod.yml up -d --build
#
# 服务端口:
#   - 后端 (uvicorn + StaticFiles): 8000（前端 + API + WebSocket 一体化）
#   - MySQL: 3306

version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: campus_daze_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-tongzhou_meow}
      MYSQL_USER: ${MYSQL_USER:-appuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-apppassword}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

  backend:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    container_name: campus_daze_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+aiomysql://${MYSQL_USER:-appuser}:${MYSQL_PASSWORD:-apppassword}@mysql:3306/${MYSQL_DATABASE:-tongzhou_meow}?charset=utf8mb4
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-please-change-this-secret-key}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      CORS_ORIGINS: '["http://localhost","http://localhost:8000","http://127.0.0.1"]'
      APP_NAME: 同舟喵济
      APP_VERSION: 1.0.0
      STATIC_DIST_DIR: /app/static_dist
    ports:
      - "${WEB_PORT:-8000}:8000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app_network

volumes:
  mysql_data:

networks:
  app_network:
    driver: bridge
