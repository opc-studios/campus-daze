[supervisord]
nodaemon=true
logfile=/var/log/campus_daze/supervisord.log
pidfile=/var/run/campus_daze_supervisord.pid
childlogdir=/var/log/campus_daze

[program:backend]
command=/opt/campus-daze/venv/bin/uvicorn api.main:app --host 127.0.0.1 --port 8000 --workers 4
directory=/opt/campus-daze/backend
user=www-data
autostart=true
autorestart=true
startretries=3
redirect_stderr=true
stdout_logfile=/var/log/campus_daze/backend.log
stderr_logfile=/var/log/campus_daze/backend_error.log
environment=PYTHONPATH=/opt/campus-daze/backend

[program:redis]
command=redis-server --bind 127.0.0.1
directory=/var/lib/redis
user=redis
autostart=true
autorestart=true
startretries=3
redirect_stderr=true
stdout_logfile=/var/log/campus_daze/redis.log
stderr_logfile=/var/log/campus_daze/redis_error.log